# Gazebo topics exposed to ROS 2. To add one, find it with `GZ_IP=127.0.0.1 gz topic -l`;
# type pairs: https://github.com/gazebosim/ros_gz/tree/jazzy/ros_gz_bridge#readme

# Needed by any node using use_sim_time.
- ros_topic_name: /clock
  gz_topic_name: /clock
  ros_type_name: rosgraph_msgs/msg/Clock
  gz_type_name: gz.msgs.Clock
  direction: GZ_TO_ROS

# x500_depth camera, for perception and rviz.
- ros_topic_name: /depth_camera
  gz_topic_name: /depth_camera
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: gz.msgs.Image
  direction: GZ_TO_ROS

- ros_topic_name: /depth_camera/points
  gz_topic_name: /depth_camera/points
  ros_type_name: sensor_msgs/msg/PointCloud2
  gz_type_name: gz.msgs.PointCloudPacked
  direction: GZ_TO_ROS

- ros_topic_name: /camera_info
  gz_topic_name: /camera_info
  ros_type_name: sensor_msgs/msg/CameraInfo
  gz_type_name: gz.msgs.CameraInfo
  direction: GZ_TO_ROS
