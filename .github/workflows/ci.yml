# CI checks to run when merging into main.

name: CI

on:
  pull_request: # runs on PRs into main
    branches: [main]

concurrency: # A new push to a PR kills the previous running CI
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Set environment variables for all jobs. 
env:
  EXPECTED_CONTAINER_USER: qadt
  CONTAINER_WORKSPACE: /home/qadt/AeroSAE2027
  ROS_WS: /home/qadt/AeroSAE2027/ros_ws
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.28.0

jobs:
  
  # Run the gitleaks container over the commits this PR adds, which fails if it finds a credential.
  secret-scan:
    name: Secret scanning
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan commits introduced by this PR
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          echo "Scanning ${BASE_SHA}..${HEAD_SHA}"
          docker run --rm -v "${PWD}:/repo" "${GITLEAKS_IMAGE}" \
            detect \
              --source=/repo \
              --redact \
              --no-banner \
              --exit-code 1 \
              --log-opts="--no-merges ${BASE_SHA}..${HEAD_SHA}"

  # Validates the dev environment configuration             
  devcontainer-build:
    name: Devcontainer config check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Generate the active compose profile
        env:
          # initialize.sh refuses to run without a usable X11 display. A hosted
          # runner has no display at all, so we assert one to get past the
          # guard; nothing in CI actually renders. Everything else in the
          # script is a no-op here (no nvidia-smi, no xhost).
          XDG_SESSION_TYPE: x11
        run: bash .devcontainer/initialize.sh

      - name: Validate the composed devcontainer stack
        run: |
          set -euo pipefail
          docker compose \
            -f .devcontainer/compose.base.yml \
            -f .devcontainer/compose.active.yml \
            config > /dev/null
          echo "compose.base.yml + compose.active.yml parse cleanly."

      - name: Check devcontainer.json agrees with the compose files
        run: |
          set -euo pipefail
          remote_user="$(grep -oP '"remoteUser"\s*:\s*"\K[^"]+' .devcontainer/devcontainer.json)"
          ws_folder="$(grep -oP '"workspaceFolder"\s*:\s*"\K[^"]+' .devcontainer/devcontainer.json)"
          compose_workdir="$(grep -oP '^\s*working_dir:\s*\K\S+' .devcontainer/compose.base.yml)"
          compose_target="$(grep -oP '^\s*target:\s*\K\S+' .devcontainer/compose.base.yml | head -1)"

          echo "devcontainer.json remoteUser       = ${remote_user}"
          echo "devcontainer.json workspaceFolder  = ${ws_folder}"
          echo "compose.base.yml  working_dir      = ${compose_workdir}"
          echo "compose.base.yml  bind target      = ${compose_target}"

          status=0
          [ "$remote_user" = "$EXPECTED_CONTAINER_USER" ] || {
            echo "::error file=.devcontainer/devcontainer.json::remoteUser is '${remote_user}', expected '${EXPECTED_CONTAINER_USER}'"; status=1; }
          [ "$ws_folder" = "$CONTAINER_WORKSPACE" ] || {
            echo "::error file=.devcontainer/devcontainer.json::workspaceFolder is '${ws_folder}', expected '${CONTAINER_WORKSPACE}'"; status=1; }
          [ "$compose_workdir" = "$CONTAINER_WORKSPACE" ] || {
            echo "::error file=.devcontainer/compose.base.yml::working_dir is '${compose_workdir}', expected '${CONTAINER_WORKSPACE}'"; status=1; }
          [ "$compose_target" = "$CONTAINER_WORKSPACE" ] || {
            echo "::error file=.devcontainer/compose.base.yml::bind target is '${compose_target}', expected '${CONTAINER_WORKSPACE}'"; status=1; }
          exit $status

      # `manifest inspect` hits the registry API only - it proves the image
      # exists and is publicly readable without downloading it. Nothing in this
      # job runs the image, so a `docker pull` here would spend ~3 min fetching
      # 6.3 GB to answer a yes/no question. Since colcon-build and lint both
      # gate on this job, that time came straight off the critical path.
      - name: Verify the dev container image is reachable
        run: |
          set -euo pipefail
          image="$(grep -oP '^\s*image:\s*\K\S+' .devcontainer/compose.base.yml | head -1)"
          echo "Checking ${image}"
          docker manifest inspect "$image" > /dev/null
          echo "Image exists and is pullable."
  
  # Build the ROS2 workspace with colcon, to verify the devcontainer is usable for development.
  colcon-build:
    name: Colcon build (ROS2 workspace)
    runs-on: ubuntu-24.04
    needs: devcontainer-build
    steps:
      - uses: actions/checkout@v4

      - name: Resolve dev container image
        run: |
          set -euo pipefail
          echo "DEV_IMAGE=$(grep -oP '^\s*image:\s*\K\S+' .devcontainer/compose.base.yml | head -1)" >> "$GITHUB_ENV"

      # Folded in from the old standalone smoke-test job. It lives here rather
      # than in its own job because a separate job means a separate VM, which
      # means a second ~3 min pull of the same image; here it rides along on the
      # pull colcon-build has to do anyway and costs seconds.
      #
      # This is the ONLY check that verifies the image actually runs as `qadt`.
      # devcontainer-build checks that devcontainer.json *claims* `qadt`, which
      # cannot catch a rename made upstream in the containers2027 repo. It runs
      # before the build so that failure surfaces in seconds with a clear
      # message, rather than as an opaque permissions error 7 minutes in.
      - name: Verify container identity
        run: |
          set -euo pipefail

          # The image entrypoint prints "==> Container ready" on stdout before
          # our command runs, so values are fished out by marker rather than by
          # capturing stdout wholesale.
          out="$(docker run --rm "${DEV_IMAGE}" bash -lc '
            echo "QADT_USER=$(whoami)"
            echo "QADT_UID=$(id -u)"
            echo "QADT_HOME=$HOME"
            echo "QADT_ROS=$(ls /opt/ros | head -1)"
          ')"
          echo "$out"

          actual_user="$(sed -n 's/^QADT_USER=//p' <<< "$out")"
          actual_home="$(sed -n 's/^QADT_HOME=//p' <<< "$out")"
          ros_distro="$(sed -n 's/^QADT_ROS=//p' <<< "$out")"

          status=0
          if [ "$actual_user" != "$EXPECTED_CONTAINER_USER" ]; then
            echo "::error::Expected container user '${EXPECTED_CONTAINER_USER}' but got '${actual_user}'"
            status=1
          fi
          if [ "$actual_home" != "/home/${EXPECTED_CONTAINER_USER}" ]; then
            echo "::error::Expected \$HOME '/home/${EXPECTED_CONTAINER_USER}' but got '${actual_home}'"
            status=1
          fi
          if [ -z "$ros_distro" ]; then
            echo "::error::No ROS distribution found under /opt/ros in the image"
            status=1
          fi

          if [ $status -eq 0 ]; then
            echo "Container identity check passed."
          fi
          exit $status

      - name: colcon build
        run: |
          set -euo pipefail

          # Canary: the image is tracked as :latest and can grow without
          # warning. Measured 2026-08-23 - the image plus build artifacts cost
          # ~15 GB of the runner's 87 GB free, so there is ample headroom today.
          echo "== disk before =="
          df -h /

          # The runner checks out as uid 1001; the container user is uid 1000.
          # Without this, colcon cannot write ros_ws/build.
          sudo chown -R 1000:1000 "$PWD"

          docker run --rm \
            -v "${PWD}:${CONTAINER_WORKSPACE}" \
            -w "${ROS_WS}" \
            "${DEV_IMAGE}" \
            bash -lc '
              # No `set -u`: ROS setup.bash reads AMENT_TRACE_SETUP_FILES
              # unconditionally and aborts under nounset.
              set -eo pipefail
              source /opt/ros/*/setup.bash
              colcon build --symlink-install --event-handlers console_direct+
            '

          echo "== disk after build =="
          df -h /
    
  # Runs lint checks on C++ and Python code. ADVISORY ONLY - every step here is
  # continue-on-error, so this job is always green and can never block a merge.
  # Findings surface three ways instead: a red X on the individual step, a
  # ::warning:: annotation on the PR, and a summary block on the run page.
  lint:
    name: Lint (Python + C++)
    runs-on: ubuntu-24.04
    needs: devcontainer-build
    steps:
      - uses: actions/checkout@v4

      - name: Resolve dev container image
        run: |
          set -euo pipefail
          echo "DEV_IMAGE=$(grep -oP '^\s*image:\s*\K\S+' .devcontainer/compose.base.yml | head -1)" >> "$GITHUB_ENV"
          echo "### Lint results (advisory - does not block merge)" >> "$GITHUB_STEP_SUMMARY"

      # C++ formatting is checked against `.clang-format` at the repo root; `.clang-format` at the repo root is the
      # style config, clang-format 18 ships in the dev container, and
      # `./scripts/format-all.sh` is the local fixer.
      #
      # px4_msgs and px4_ros_com are excluded: CLAUDE.md declares them vendored,
      # unmodified upstream PX4 packages, and px4_ros_com does not satisfy this
      # repo's .clang-format. (Note that scripts/format-all.sh does NOT exclude
      # them - do not run it blindly, or it will reformat vendored sources.)
      - name: C++ format check (clang-format)
        continue-on-error: true
        run: |
          set -euo pipefail
          if docker run --rm -v "${PWD}:${CONTAINER_WORKSPACE}" -w "${CONTAINER_WORKSPACE}" "${DEV_IMAGE}" \
            bash -lc '
              set -euo pipefail
              clang-format --version
              find ros_ws/src \
                -path "*/px4_msgs/*" -prune -o \
                -path "*/px4_ros_com/*" -prune -o \
                -path "*/build/*" -prune -o \
                -path "*/install/*" -prune -o \
                -regextype posix-extended -regex ".*\.(cpp|c|cc|cxx|h|hh|hpp)" -print0 \
              | xargs -0 --no-run-if-empty clang-format --dry-run --Werror
              echo "clang-format: clean"
            '; then
            echo "- C++ (clang-format): clean" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::clang-format found formatting violations. Run ./scripts/format-all.sh to fix. Advisory only - not blocking this PR."
            echo "- C++ (clang-format): **violations found** - run \`./scripts/format-all.sh\`" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      # Python linting uses ament_flake8 / ament_pep257 - the tools the three
      # ament_python packages already declare in their own test/ folders, and
      # the ones `colcon test` would run. No ruff/black/flake8 config exists
      # anywhere in the repo, so introducing one here would have been a new
      # tool, not the configured one.
      #
      # These packages currently fail their own lint tests on `main`
      # (hardware_controllers alone has ~80 quote-style violations), so this
      # reports rather than gates. Cleaning that backlog is a separate PR.
      - name: Python lint (ament_flake8 + ament_pep257) - report only
        continue-on-error: true
        run: |
          set -euo pipefail
          if docker run --rm -v "${PWD}:${CONTAINER_WORKSPACE}" -w "${CONTAINER_WORKSPACE}" "${DEV_IMAGE}" \
            bash -lc '
              source /opt/ros/*/setup.bash
              status=0
              for pkg in navigation_core hardware_controllers google_drive; do
                echo "===== ${pkg} ====="
                ( cd "ros_ws/src/${pkg}" && ament_flake8 . ) || status=1
                ( cd "ros_ws/src/${pkg}" && ament_pep257 . ) || status=1
              done
              exit $status
            '; then
            echo "- Python (ament_flake8 + ament_pep257): clean" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::ament_flake8/ament_pep257 reported violations. Advisory only - not blocking this PR."
            echo "- Python (ament_flake8 + ament_pep257): **violations found**" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
