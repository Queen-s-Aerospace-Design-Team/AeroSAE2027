# Defines the shared Dev Container service, image, workspace bind mount, and SSH forwarding.
# This is the base compose file which is used with every profile. SSH keys directory binding
# allows developers to make git commits inside the dev container if they wanted.
# Most importantly, it binds THIS working directory into /home/qadt/AeroSAE2027, regardless of
# what the local clone directory is actually named on disk (a fork, a rename, etc.) — bind
# mount source/target names don't need to match. This path is deliberately a fixed literal,
# not templated: docker compose does not resolve devcontainer.json-only variables like
# ${localWorkspaceFolderBasename} (that's a devcontainers-CLI-only substitution), and a fixed
# path keeps every team member's container laid out identically, matching devcontainer.json's
# "workspaceFolder" and the ROS_WS convention documented in CLAUDE.md.
name: qadt-devcontainer
services:
  dev:
    image: ghcr.io/queen-s-aerospace-design-team/devcontainer-px4:latest
    pull_policy: always
    tty: true
    privileged: true
    stdin_open: true
    container_name: qadt-devcontainer
    working_dir: /home/qadt/AeroSAE2027
    volumes:
      - type: bind
        source: ..
        target: /home/qadt/AeroSAE2027
      # Forward SSH from host -> container
      - type: bind
        source: ${HOME}/.ssh
        target: /home/qadt/.ssh
        read_only: true
    environment:
      QT_X11_NO_MITSHM: "1"
      # Commented out until I find a reason to use these. Currently, using them make MicroXRCEDDS not correctly report ROS topics.
      # ROS_AUTOMATIC_DISCOVERY_RANGE: "LOCALHOST"
      # ROS_LOCALHOST_ONLY: "1"
      # ROS_DOMAIN_ID: "42"
